name: Publish ExplorersIceboxJP upload

on:
  push:
    branches: [ main ]
    paths:
      - "upload/ExplorersIceboxJP_v*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select uploaded package
        id: pkg
        shell: bash
        run: |
          ZIP=""
          if [ "${{ github.event_name }}" = "push" ]; then
            ZIP=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^upload/ExplorersIceboxJP_v[0-9]+(\.[0-9]+)+\.zip$' | head -n 1 || true)
          fi
          if [ -z "$ZIP" ]; then
            ZIP=$(find upload -maxdepth 1 -type f -name 'ExplorersIceboxJP_v*.zip' | sort -V | tail -n 1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "No upload ZIP found."
            exit 1
          fi
          FILE=$(basename "$ZIP")
          VERSION=${FILE#ExplorersIceboxJP_v}
          VERSION=${VERSION%.zip}
          TAG="V${VERSION}"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify package and version
        shell: bash
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          test -s "$ZIP"
          python3 - <<'PY'
          import json, os, zipfile
          path = os.environ['ZIP']
          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              required = ('ExplorersIceboxJP.dll', 'ExplorersIceboxJP.json', 'images/icon.png')
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit(f'配布ZIP内の必須ファイルがありません: {missing}; ZIP内容: {sorted(names)}')
              if z.getinfo('images/icon.png').file_size == 0:
                  raise SystemExit('images/icon.png が空です')
              manifest = json.loads(z.read('ExplorersIceboxJP.json').decode('utf-8-sig'))
          expected = os.environ['VERSION'] + '.0'
          actual = manifest.get('AssemblyVersion')
          if actual != expected:
              raise SystemExit(f'AssemblyVersion mismatch: ZIP={actual!r}, filename={expected!r}')
          print(f'配布ZIP検証OK: AssemblyVersion={actual}, icon=images/icon.png')
          PY

      - name: Sync pluginmaster and icon
        shell: bash
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p images
          unzip -p "$ZIP" images/icon.png > images/icon.png
          test -s images/icon.png
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          version = os.environ['VERSION']
          path = Path('pluginmaster.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          if not isinstance(data, list) or not data:
              raise SystemExit('pluginmaster.json must contain a non-empty JSON array')
          entry = data[0]
          url = f'https://github.com/elpapityo/ExplorersIceboxJP/releases/download/V{version}/ExplorersIceboxJP_v{version}.zip'
          entry['AssemblyVersion'] = f'{version}.0'
          entry['DownloadLinkInstall'] = url
          entry['DownloadLinkUpdate'] = url
          entry['DownloadLinkTesting'] = url
          entry['IconUrl'] = f'https://raw.githubusercontent.com/elpapityo/ExplorersIceboxJP/main/images/icon.png?v={version}'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f"Synced pluginmaster.json -> {version}.0")
          PY
          git add pluginmaster.json images/icon.png
          if ! git diff --cached --quiet -- pluginmaster.json images/icon.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync pluginmaster and icon for v${VERSION}"
            git push
          else
            echo "pluginmaster.json and icon already match v${VERSION}."
          fi

      - name: Create or replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "ExplorersIceboxJP v${VERSION}" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --title "ExplorersIceboxJP v${VERSION}" --notes-file CHANGELOG.md
          fi
