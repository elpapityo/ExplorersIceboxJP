name: Mirror ExplorersIceboxJP v0.1.4 release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified v0.1.4 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          curl -fL             "https://github.com/elpapityo/ExplorersIcebox_JP/releases/download/V0.1.4/ExplorersIceboxJP_v0.1.4.zip"             -o "upload/ExplorersIceboxJP_v0.1.4.zip"
          test -s "upload/ExplorersIceboxJP_v0.1.4.zip"

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, zipfile
          p='upload/ExplorersIceboxJP_v0.1.4.zip'
          with zipfile.ZipFile(p) as z:
              names={n.replace('\\','/'):n for n in z.namelist()}
              for required in ['ExplorersIceboxJP.dll','ExplorersIceboxJP.json','images/icon.png']:
                  if required not in names:
                      raise SystemExit(f'Missing {required}')
              manifest=json.loads(z.read(names['ExplorersIceboxJP.json']).decode('utf-8-sig'))
              if manifest.get('AssemblyVersion')!='0.1.4.0':
                  raise SystemExit(f"Unexpected AssemblyVersion {manifest.get('AssemblyVersion')}")
              if manifest.get('InternalName')!='ExplorersIceboxJP':
                  raise SystemExit(f"Unexpected InternalName {manifest.get('InternalName')}")
          print('Package verified: ExplorersIceboxJP 0.1.4.0')
          PY

      - name: Update pluginmaster and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('pluginmaster.json')
          data=json.loads(path.read_text(encoding='utf-8-sig'))
          e=data[0]
          e['Changelog']='v0.1.4: 畑の操作を「水やり」「収穫」「種まき→水やり」に分離。空き区画へ選択中の種をまき、その区画へ続けて水やりします。'
          e['AssemblyVersion']='0.1.4.0'
          e['RepoUrl']='https://github.com/elpapityo/ExplorersIcebox_JP'
          e['IconUrl']='https://raw.githubusercontent.com/elpapityo/ExplorersIceboxJP/main/images/icon.png?v=0.1.4'
          url='https://github.com/elpapityo/ExplorersIceboxJP/releases/download/V0.1.4/ExplorersIceboxJP_v0.1.4.zip'
          e['DownloadLinkInstall']=url
          e['DownloadLinkUpdate']=url
          e['DownloadLinkTesting']=url
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('VERSION.txt').write_text('0.1.4\n',encoding='utf-8')
          PY

      - name: Commit repository metadata and package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json VERSION.txt upload/ExplorersIceboxJP_v0.1.4.zip
          if ! git diff --cached --quiet; then
            git commit -m "Release ExplorersIceboxJP v0.1.4"
            git push
          fi

      - name: Create v0.1.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view V0.1.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload V0.1.4 upload/ExplorersIceboxJP_v0.1.4.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit V0.1.4 --repo "$GITHUB_REPOSITORY" --title "ExplorersIceboxJP v0.1.4" --notes "v0.1.4: 畑の操作を「水やり」「収穫」「種まき→水やり」に分離。空き区画へ選択中の種をまき、その区画へ続けて水やりします。"
          else
            gh release create V0.1.4 upload/ExplorersIceboxJP_v0.1.4.zip --repo "$GITHUB_REPOSITORY" --title "ExplorersIceboxJP v0.1.4" --notes "v0.1.4: 畑の操作を「水やり」「収穫」「種まき→水やり」に分離。空き区画へ選択中の種をまき、その区画へ続けて水やりします。"
          fi
